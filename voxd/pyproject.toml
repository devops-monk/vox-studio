[project]
name = "voxd"
version = "1.0.0"
description = "VoxStudio inference daemon"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "kokoro-onnx>=0.4",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
