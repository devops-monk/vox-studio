[package]
name = "voxstudio"
version = "0.1.0"
description = "VoxStudio – local AI voice cloning, design and dubbing"
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voxstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
getrandom = "0.3"
